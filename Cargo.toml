[package]
name = "cu_save_editor"
version = "0.3.0"
edition = "2024"
description = "Save editor and wiki for the game Casualties Unknown"
repository = "https://github.com/PavelKotDRM/casualties_unknown_save_edit"

[dependencies]
chrono = "0.4"
dotscope = { version = "0.9.1", default-features = false }
dirs = "7"
eframe = "0.37"
egui = "0.37"
flate2 = "1"
rfd = "0.18"
serde_json = { version = "1", features = ["preserve_order"] }
unity-rs-core = "0.6"

[dev-dependencies]
tempfile = "3"
syn = { version = "3", features = ["full", "visit"] }

[build-dependencies]
syn = { version = "3", features = ["full", "visit"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
