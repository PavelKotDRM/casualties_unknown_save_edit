# Keeps the CI actions (pinned by commit SHA) and the Rust dependencies up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo-all:
        update-types: [major, minor, patch]
    commit-message:
      prefix: deps
