name: Bug report
description: Something in the editor does not work or a save is changed incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The easiest way to file a report is **Help → Report a problem…** in the editor: it fills in this form for you.

        🔒 **Privacy:** issues are public. Do not attach save files, and check that the text below contains no personal information (names, paths, account ids).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the save …
        2. Click …
        3. See …
  - type: textarea
    id: diagnostics
    attributes:
      label: Debugging information
      description: Generated by **Help → Report a problem…** (personal details are already replaced with placeholders). If it was too long for the link, it is on your clipboard — paste it here.
      render: markdown
