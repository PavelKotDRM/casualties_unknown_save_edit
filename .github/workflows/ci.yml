name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal -c rustfmt && rustup default stable
      - run: cargo fmt --all --check

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: cu_save_editor.exe
          - os: ubuntu-latest
            binary: cu_save_editor
          - os: macos-latest
            binary: cu_save_editor
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Clippy
        run: cargo clippy --all-targets --locked
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cu_save_editor-${{ runner.os }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14
